name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-debug.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner already includes Android SDK; setup-android@v3 fails
      # because it attempts to install the removed SDK package 'tools'.
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
      - name: Generate Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: USTAAD-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
